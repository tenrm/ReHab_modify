<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Community Forest &amp; Rare Birds · เกมป่าชุมชนกับนกหายาก</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Domine:wght@400..700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* W12 เกมป่าชุมชนกับนกหายาก — styles (base copied from W11, forest palette) */
:root {
  --bg: #F4F7F2; --surface: #FFFFFF; --surface2: #EAF1E6; --line: #D5E1CF; --line2: #B7CBAE;
  --ink: #17231A; --ink2: #3B4E40; --muted: #66796B;
  --pri: #2F6B3A; --pri2: #3F8A4C; --pri-soft: #DDEFD9; --on-pri: #FFFFFF;
  --warn: #B45309; --warn-soft: #FEF3C7; --bad: #B42318; --bad-soft: #FEE4E2; --ok: #1E7B4F; --ok-soft: #DCFCE7;
  --b0: #FFFFFF; --b1: #8EE08E; --b2: #3DAA4A; --b3: #1B5E27; --b-ink0: #3B4E40; --b-ink: #FFFFFF;
  --reserve: #D1293D; --chick: #F2C230; --bird: #7A4B1E; --labour: #17231A;
  --radius: 10px; --shadow: 0 1px 2px rgba(20, 40, 24, .06), 0 4px 16px rgba(20, 40, 24, .06);
  --font: "Sarabun", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1510; --surface: #151F18; --surface2: #1B281F; --line: #283A2D; --line2: #35493A;
    --ink: #E3EEE5; --ink2: #BDD0C1; --muted: #8DA293;
    --pri: #7CCB86; --pri2: #9ADAA2; --pri-soft: #1C3522; --on-pri: #08140B;
    --warn: #F4B35A; --warn-soft: #3A2A10; --bad: #F7907F; --bad-soft: #3B1A16; --ok: #6EE7A8; --ok-soft: #143325;
    --b0: #E9EEE8; --b1: #7ED17E; --b2: #3A9B45; --b3: #1E5B28; --b-ink0: #26352A; --b-ink: #FFFFFF;
    --reserve: #FF6B7A; --chick: #F6CF4F; --bird: #C58B52; --labour: #0E1510;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1510; --surface: #151F18; --surface2: #1B281F; --line: #283A2D; --line2: #35493A;
  --ink: #E3EEE5; --ink2: #BDD0C1; --muted: #8DA293;
  --pri: #7CCB86; --pri2: #9ADAA2; --pri-soft: #1C3522; --on-pri: #08140B;
  --warn: #F4B35A; --warn-soft: #3A2A10; --bad: #F7907F; --bad-soft: #3B1A16; --ok: #6EE7A8; --ok-soft: #143325;
  --b0: #E9EEE8; --b1: #7ED17E; --b2: #3A9B45; --b3: #1E5B28; --b-ink0: #26352A; --b-ink: #FFFFFF;
  --reserve: #FF6B7A; --chick: #F6CF4F; --bird: #C58B52; --labour: #0E1510;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--pri); }
h1, h2, h3, h4 { line-height: 1.35; margin: 0 0 .5rem; }
p { margin: 0 0 .75rem; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1180px; margin: 0 auto; padding: .55rem 16px; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand .eyebrow { font-size: .72rem; letter-spacing: .08em; color: var(--pri); font-weight: 700; text-transform: uppercase; }
.brand .title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.sync { display: inline-flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--ink2); padding: .2rem .6rem; border-radius: 999px; background: var(--surface2); white-space: nowrap; }
.sync::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--ok); }
.sync.pending::before { background: var(--warn); }
.sync.err::before { background: var(--bad); }
.actions { display: flex; gap: .4rem; flex-wrap: wrap; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; min-height: 40px; padding: .4rem .85rem; border-radius: 8px;
  border: 1px solid var(--line2); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; font-size: .92rem; text-decoration: none; }
.btn:hover { background: var(--surface2); }
.btn:focus-visible, .field:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--pri) 45%, transparent); outline-offset: 1px; }
.btn.primary { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.sm { min-height: 32px; padding: .2rem .6rem; font-size: .84rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* ---------- Layout ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
.banner { border-radius: var(--radius); padding: .65rem .9rem; margin-bottom: 1rem; font-size: .92rem; display: flex; gap: .6rem; align-items: flex-start; flex-wrap: wrap; }
.banner.info { background: var(--pri-soft); color: var(--ink); }
.banner.warn { background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.banner.err { background: var(--bad-soft); color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem; margin-bottom: 1rem; }
.card h3 { font-size: 1.05rem; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem 1rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem 1rem; }
@media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: .35rem; overflow-x: auto; padding-bottom: .25rem; margin-bottom: 1rem; scrollbar-width: thin; }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .35rem .85rem; cursor: pointer; display: flex; align-items: center; gap: .45rem; font-weight: 600; font-size: .9rem; color: var(--ink2); }
.tab .n { width: 1.5rem; height: 1.5rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); font-size: .8rem; }
.tab .done { width: .5rem; height: .5rem; border-radius: 50%; background: var(--line2); }
.tab .done.full { background: var(--ok); }
.tab .done.part { background: var(--warn); }
.tab.active { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.tab.active .n { background: color-mix(in srgb, var(--on-pri) 20%, transparent); }
.sect-h { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: .6rem; }
.sect-h .src { font-size: .8rem; color: var(--muted); }

/* ---------- Fields ---------- */
label.lbl { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .2rem; color: var(--ink2); }
label.lbl small { font-weight: 400; color: var(--muted); }
.field, textarea, select { width: 100%; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); padding: .45rem .6rem; min-height: 42px; }
textarea { resize: vertical; min-height: 64px; line-height: 1.55; }
textarea.tall { min-height: 110px; }
.field::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
input[type="range"] { width: 100%; accent-color: var(--pri); min-height: 32px; }
.check { display: flex; gap: .5rem; align-items: flex-start; padding: .35rem .4rem; border-radius: 6px; cursor: pointer; font-size: .9rem; }
.check:hover { background: var(--surface2); }
.check input { width: 1.15rem; height: 1.15rem; margin-top: .2rem; accent-color: var(--pri); flex: 0 0 auto; }

.two-col { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 960px) { .two-col { grid-template-columns: 1fr; } }
.chart-box { position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 520px; }
.chart-box.wide { aspect-ratio: 16 / 10; max-height: 380px; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem .9rem; font-size: .84rem; color: var(--ink2); margin-top: .5rem; }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; margin-right: .3rem; vertical-align: -1px; }

/* ---------- KAP ---------- */
.kap-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; }
@media (max-width: 760px) { .kap-grid { grid-template-columns: 1fr; } }
.kpi { display: flex; gap: 1rem; flex-wrap: wrap; }
.kpi .box { background: var(--surface2); border-radius: var(--radius); padding: .6rem .9rem; min-width: 150px; }
.kpi .v { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .82rem; color: var(--muted); }
table.mx { border-collapse: collapse; width: 100%; font-size: .88rem; }
table.mx th, table.mx td { border: 1px solid var(--line); padding: .35rem .45rem; text-align: center; }
table.mx th:first-child, table.mx td:first-child { text-align: left; }
table.mx th { background: var(--surface2); font-weight: 600; }
.tick { color: var(--pri); font-weight: 700; }
.scroll-x { overflow-x: auto; }

/* ---------- Modal / overlay ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 20, 14, .55); display: none; align-items: flex-start; justify-content: center; z-index: 60; padding: 5vh 16px; overflow-y: auto; }
.overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: 14px; width: min(560px, 100%); padding: 1.2rem 1.2rem 1rem; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); position: relative; }
.modal.wide { width: min(920px, 100%); }
.modal .x { position: absolute; top: .6rem; right: .6rem; }
.choice { display: grid; gap: .5rem; margin-top: .75rem; }
.choice .btn { justify-content: flex-start; text-align: left; min-height: 56px; }
.choice .btn span.sub { display: block; font-weight: 400; font-size: .82rem; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; margin: .6rem 0 1rem; }
.seg button { flex: 1; border: 0; background: var(--surface); padding: .5rem; cursor: pointer; font-weight: 600; }
.seg button.on { background: var(--pri); color: var(--on-pri); }
.code-big { font: 700 2rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .15em; text-align: center; padding: .5rem; background: var(--surface2); border-radius: 8px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(120%); background: var(--ink); color: var(--bg); padding: .5rem 1rem; border-radius: 999px; font-size: .9rem; transition: transform .2s; z-index: 80; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* ---------- Presenter ---------- */
.pres { position: fixed; inset: 0; background: var(--bg); z-index: 70; overflow-y: auto; display: none; }
.pres.show { display: block; }
.pres-in { max-width: 1280px; margin: 0 auto; padding: 24px 16px 40px; }
.pres h1 { font-size: clamp(1.6rem, 3vw, 2.4rem); }
.pres .tag { font-size: .8rem; letter-spacing: .1em; color: var(--pri); font-weight: 700; }
.quad-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
@media (max-width: 760px) { .quad-cards { grid-template-columns: 1fr; } }
.quad-card { border-radius: var(--radius); padding: .8rem 1rem; border: 2px solid; background: var(--surface); }
.quad-card h3 { font-size: 1rem; }
.quad-card ul { margin: 0; padding-left: 1.1rem; }

table.list { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.list th, table.list td { padding: .5rem .5rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.list th { font-size: .82rem; color: var(--muted); font-weight: 600; }
.bar { height: .5rem; background: var(--surface2); border-radius: 999px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--pri); }
.qr { display: grid; place-items: center; padding: .5rem; background: #fff; border-radius: 8px; }
.qr img, .qr svg { width: 100%; max-width: 280px; height: auto; }

@media print {
  .topbar, .tabs, .actions, .diag-bar, .btn, .banner, .overlay, .toast { display: none !important; }
  body { background: #fff; color: #000; }
  .card { box-shadow: none; break-inside: avoid; }
  .sh-body { display: block !important; }
}

.print-only { display: none; }
@media print {
  main.wrap { display: none !important; }
  .print-only { display: block !important; padding: 0 8mm; }
  .print-only .chart-box { max-height: 360px; }
}


/* ---------- W11 specific ---------- */
table.dec { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .9rem; }
table.dec th, table.dec td { padding: .35rem .4rem; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; white-space: nowrap; }
table.dec th { font-size: .78rem; color: var(--muted); font-weight: 600; background: var(--surface2); position: sticky; top: 0; }
table.dec th.grp { font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; }
table.dec td.team { text-align: left; font-weight: 700; position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.dec input.n { width: 4.6rem; min-height: 38px; text-align: right; font-variant-numeric: tabular-nums; border: 1px solid var(--line2); border-radius: 7px; background: var(--surface); padding: .25rem .4rem; }
table.dec input.n.bad { border-color: var(--bad); background: var(--bad-soft); }
table.dec td.num, table.res td.num { font-variant-numeric: tabular-nums; text-align: right; }
table.res { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.res th, table.res td { border-bottom: 1px solid var(--line); padding: .4rem .5rem; text-align: right; white-space: nowrap; }
table.res th:first-child, table.res td:first-child { text-align: left; }
table.res th { font-size: .8rem; color: var(--muted); font-weight: 600; }
table.res tr.sub td { color: var(--muted); font-size: .85rem; }
table.res tr.total td { font-weight: 700; border-top: 2px solid var(--line2); }
.neg { color: var(--bad); }
.pos { color: var(--ok); }
.stepper { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.yearbar { display: flex; gap: .25rem; margin: .4rem 0 .2rem; }
.yearbar i { flex: 1; height: .45rem; border-radius: 999px; background: var(--line); }
.yearbar i.done { background: var(--pri); } .yearbar i.now { background: var(--warn); }
details.adv { border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .8rem; background: var(--surface); }
details.adv summary { cursor: pointer; font-weight: 700; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .6rem .9rem; margin-top: .7rem; }
.pgrid label { font-size: .84rem; color: var(--ink2); font-weight: 600; display: block; }
.pgrid .field { min-height: 38px; }
.teamrow { display: grid; grid-template-columns: 2rem minmax(0, 1fr) minmax(0, 12rem); gap: .5rem; align-items: center; margin-bottom: .45rem; }
.teamrow .dot { width: 1.2rem; height: 1.2rem; border-radius: 50%; justify-self: center; }
@media (max-width: 560px) { .teamrow { grid-template-columns: 1.5rem minmax(0, 1fr); } .teamrow select { grid-column: 2; } }
.sess { display: flex; gap: .6rem; align-items: center; padding: .5rem 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sess:last-child { border-bottom: 0; }
.sess .t { flex: 1; min-width: 12rem; }
.sess.active .t b::after { content: "  • กำลังเล่น"; color: var(--pri); font-weight: 600; font-size: .85rem; }
.qlist li { margin-bottom: .45rem; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
@media (max-width: 960px) { .charts { grid-template-columns: 1fr; } }
.sheet { break-after: page; }
.sheet h2 { font-size: 1.15rem; margin-bottom: .2rem; }
.sheet table.mx { font-size: .8rem; }
.sheet table.mx td { height: 1.7rem; }
@media print { .pres { display: none !important; } }
@media print {
  body.print-main main.wrap { display: block !important; }
  body.print-main .print-only { display: none !important; }
  body.print-main .charts { grid-template-columns: 1fr 1fr; }
}

/* ---------- W12 board ---------- */
.forest { display: grid; gap: 4px; width: 100%; max-width: 560px; aspect-ratio: 5 / 4; }
.forest.small { max-width: 220px; gap: 2px; }
.cell { position: relative; border-radius: 6px; border: 1px solid var(--line2); display: flex; flex-direction: column; justify-content: space-between; padding: 3px 5px; font-size: .78rem; line-height: 1.2; color: var(--b-ink); min-width: 0; user-select: none; }
.forest.small .cell { border-radius: 3px; padding: 1px 3px; font-size: .6rem; }
.cell.l0 { background: var(--b0); color: var(--b-ink0); }
.cell.l1 { background: var(--b1); color: var(--b-ink0); }
.cell.l2 { background: var(--b2); }
.cell.l3 { background: var(--b3); }
.cell.res { outline: 3px solid var(--reserve); outline-offset: -3px; }
.cell.click { cursor: pointer; }
.cell.click:hover { filter: brightness(1.08); }
.cell .no { font-weight: 700; opacity: .9; }
.cell .lab { align-self: flex-end; font-weight: 700; background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--ink); border-radius: 999px; padding: 0 .4rem; font-size: .75rem; }
.forest.small .cell .lab { font-size: .55rem; padding: 0 .25rem; }
.cell .bird { position: absolute; right: 4px; top: 3px; width: 34%; max-width: 38px; }
.forest.small .cell .bird { max-width: 16px; }
.cell .chk { position: absolute; left: 5px; bottom: 4px; display: flex; gap: 2px; }
.cell .chk i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--chick); border: 1px solid #7a5b00; }
.cell .chk.none::after { content: "✕"; color: var(--bad); font-weight: 700; font-size: .8rem; background: var(--surface); border-radius: 4px; padding: 0 .2rem; }
.lvl-legend { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; font-size: .85rem; margin: .5rem 0; }
.lvl-legend i { display: inline-block; width: 1rem; height: 1rem; border-radius: 3px; border: 1px solid var(--line2); vertical-align: -3px; margin-right: .25rem; }
.lvl-legend .r { outline: 3px solid var(--reserve); outline-offset: -3px; background: transparent; }
.years5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6rem; }
.years5 .yh { font-size: .8rem; font-weight: 700; margin-bottom: .2rem; }
@media (max-width: 760px) { .years5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
table.choice-t input { width: 3.6rem; min-height: 36px; text-align: center; padding: .2rem; }
table.choice-t td, table.choice-t th { padding: .25rem .3rem; text-align: center; }
table.res { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.res th, table.res td { border-bottom: 1px solid var(--line); padding: .35rem .45rem; text-align: right; }
table.res th:first-child, table.res td:first-child { text-align: left; }
table.res thead th { background: var(--surface2); font-weight: 600; }
table.res tr.total td { font-weight: 700; border-top: 2px solid var(--line2); }
.goal { display: flex; gap: .5rem; align-items: flex-start; padding: .45rem .6rem; border-radius: 8px; background: var(--surface2); margin-bottom: .4rem; }
.goal .st { font-weight: 700; min-width: 4.5rem; }
.goal.ok .st { color: var(--ok); } .goal.no .st { color: var(--bad); } .goal.wait .st { color: var(--muted); }
.pres .forest { max-width: min(92vw, 118vh); }
.pres .cell { font-size: 1.3rem; padding: 6px 10px; }
.pres .cell .lab { font-size: 1.2rem; }
.pres .cell .chk i { width: 1.1rem; height: 1.1rem; }
.sheet-table { border-collapse: collapse; width: 100%; font-size: .82rem; }
.sheet-table th, .sheet-table td { border: 1px solid var(--line2); padding: .25rem .3rem; text-align: center; }
.sheet-table td.l { text-align: left; }
@media print { .forest { max-width: 100%; } .cell { -webkit-print-color-adjust: exact; print-color-adjust: exact; } .page-break { break-before: page; } }
.cell .bird { background: color-mix(in srgb, #fff 82%, transparent); border-radius: 50%; padding: 2px; }
.forest.small .cell .bird { padding: 1px; }
.forest.small .cell .chk { left: 2px; bottom: 2px; gap: 1px; }
.forest.small .cell .chk i { width: .38rem; height: .38rem; }
.forest.small .cell .chk.none::after { font-size: .55rem; padding: 0 .12rem; border-radius: 3px; }
@media (max-width: 760px) { .forest.small .cell .lab { display: none; } }
.goal.info .st { color: var(--pri); }

/* header: four buttons (▶ จอฉาย, ⬇ JSON, ⬆ นำเข้า JSON, ◐) on one row at phone width */
@media (max-width: 480px) { .topbar .actions { gap: .3rem; } .topbar .actions .btn { padding: .3rem .5rem; font-size: .84rem; } }

/* ---------- วิธีเล่น tab and 🖨 พิมพ์กติกา (A4) ---------- */
.howto h2 { font-size: 1.2rem; }
.howto h3 { font-size: 1.05rem; margin-top: 1.2rem; color: var(--pri); }
.howto h4 { font-size: .95rem; margin: .8rem 0 .3rem; }
.howto ul, .howto ol { margin: .2rem 0 .6rem; padding-left: 1.3rem; }
.howto li { margin-bottom: .3rem; }
.howto ol.small, .rulesp ol.small { font-size: inherit; margin: .2rem 0 .6rem 1.3rem !important; }
blockquote.tb { margin: .5rem 0 .8rem; padding: .5rem .8rem; border-left: 4px solid var(--pri); background: var(--surface2); border-radius: 0 8px 8px 0; font-size: .92rem; }
blockquote.tb ul { margin: .3rem 0 0; }
blockquote.tb cite { display: block; font-style: normal; font-size: .8rem; color: var(--muted); margin-top: .25rem; }
.hw-note { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 8px; padding: .5rem .8rem; font-size: .88rem; margin: .4rem 0 .8rem; }
.hw-map { max-width: 260px; margin: .4rem 0 .8rem; }
.hw-map .forest.small { max-width: 260px; }
.hw-cols { columns: 2; column-gap: 1.5rem; }
@media (max-width: 560px) { .hw-cols { columns: 1; } }
table.hw { border-collapse: collapse; width: 100%; font-size: .88rem; margin: .3rem 0 .8rem; }
table.hw th, table.hw td { border: 1px solid var(--line); padding: .3rem .5rem; text-align: left; vertical-align: top; }
table.hw th { background: var(--surface2); }
@page rules { size: A4; margin: 12mm; }
.rulesp { page: rules; font-size: 10.5pt; line-height: 1.6; color: #111; }
.rulesp h2, .rulesp h3, .rulesp h4 { line-height: 1.7; } /* Thai upper marks must stay inside the line box, or they paint on the previous page */
.rulesp :not(.cell):not(.cell *) { color: #111; }
.rulesp .muted, .rulesp cite { color: #555 !important; }
.rulesp h2 { font-size: 15pt; margin: 0 0 2mm; }
.rulesp h3 { font-size: 12pt; margin: 4mm 0 1.5mm; break-after: avoid; }
.rulesp h4 { font-size: 11pt; margin: 2.5mm 0 1mm; break-after: avoid; }
.rulesp p { margin: 0 0 1.5mm; }
.rulesp ul, .rulesp ol { margin: 0 0 2mm; padding-left: 6mm; }
.rulesp li { margin-bottom: .8mm; }
.rulesp blockquote.tb { background: none; border-left: 2.5pt solid #777; padding: 1mm 3mm; margin: 1.5mm 0 2.5mm; font-size: 10pt; break-inside: avoid; }
.rulesp .hw-note { background: none; border: 1px solid #999; }
.rulesp .hw-map { width: 48mm; break-inside: avoid; }
.rulesp .hw-map .forest { max-width: 48mm; }
.rulesp .hw-cols { columns: 3; font-size: 9pt; }
.rulesp table.hw { font-size: 9.5pt; } .rulesp table.hw th, .rulesp table.hw td { border-color: #999; padding: .8mm 1.5mm; background: none; }
.rulesp tr { break-inside: avoid; }
@media print { .print-only .rulesp { margin: 0 -8mm; } }

/* additions for the standalone bilingual W12 app (on top of workshops/w12/css/app.css) */
.credit-bar { margin: 1.2rem 0 .4rem; padding: .6rem .8rem; border: 1px solid var(--line2); border-radius: 10px; background: var(--surface); font-size: .82rem; color: var(--ink2); line-height: 1.55; }
@media print { .credit-bar { display: none; } }
#bLang { min-width: 3.2rem; }
/* five header buttons on one row at phone width */
@media (max-width: 480px) { .topbar .actions { flex-wrap: wrap; } }
/* discussion tab and worksheet */
ol.dql { padding-left: 1.6rem; }
ol.dql > li.dq { margin-bottom: .7rem; }
ol.dsub { margin: .2rem 0 .2rem 1.2rem; padding: 0; }
table.qtab { margin: .4rem 0 .2rem; }
table.qtab th { background: var(--surface2); }
.ans-lines .ans { border-bottom: 1px dotted #888; height: 8mm; }
.ans-box { border: 1px solid #999; border-radius: 4px; margin: 1.5mm 0; }
.qsheet ol.dql > li.dq { break-inside: avoid; margin-bottom: 3mm; }
.qsheet table.qtab th { background: none; }
.qsheet table.qtab th, .qsheet table.qtab td { border-color: #777; }
@media print { .page-break { break-before: page; } }
.sheet-table td.l { white-space: nowrap; }
html[lang="en"] .sess.active .t b::after { content: "  • open"; }
/* answers in the Discussion tab (PD, 18 Oct 2026) */
.ans-ta { width: 100%; min-height: 3.2rem; margin: .35rem 0 .2rem; padding: .45rem .6rem; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: .95rem; line-height: 1.5; resize: vertical; }
.ans-ta:focus { outline: 2px solid var(--pri); outline-offset: 1px; }
td.ta-cell { padding: .2rem !important; vertical-align: top; }
td.ta-cell .ans-ta { margin: 0; min-height: 2.6rem; font-size: .88rem; }
.part-off { opacity: .6; }
.ans-out { border-left: 2.5pt solid #999; padding: 1mm 3mm; margin: 1mm 0 2mm; white-space: normal; }
.ansp table.qtab td.l { text-align: left; vertical-align: top; height: auto; }
.ansp ol.dql > li.dq { break-inside: auto; }
details.card > summary { cursor: pointer; }
/* brief slides */
.bstage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: #1F3A2B; }
.bstage:fullscreen { border-radius: 0; background: #111; }
.bslide { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; box-sizing: border-box; overflow: hidden; }
.bslide h1, .bslide h2, .bslide h3, .bslide p, .bslide ul, .bslide table { margin: 0; }
.bslide h1 { line-height: 1.1; } .bslide h2 { line-height: 1.15; } .bslide h3 { line-height: 1.2; } .bslide p { line-height: 1.4; }
.bslide ul { padding-left: 1.2em; } .bslide li { margin: 0 0 .2em; }
.bslide table.btab { border-collapse: collapse; width: 100%; align-self: start; color: inherit; }
.bslide table.btab th, .bslide table.btab td { border-bottom: 2px solid #C9D8CC; padding: 14px 18px; background: none; }
.bslide table.btab th { color: #1F3A2B; font-weight: 700; }
@page brief { size: A4 landscape; margin: 10mm; }
.bprint { page: brief; height: 588px; overflow: hidden; break-after: page; break-inside: avoid; }
.bprint-in .bslide { position: relative; transform: none; zoom: .5453; }
.bprint .bslide { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

</style>

      '<b>Chicks:</b> if anyone cuts in a cell where a bird nests, the bird lays no eggs. If nobody cuts there, look at the 8 neighbouring cells (diagonals included): a share of quiet neighbours above ' + p.chick1 + ' gives 1 chick, ' + p.chick2 + ' or more gives 2 chicks',
      '<b>Forest change (end of the year):</b> a cell cut by 1 person keeps its biomass; a cell cut by 2 or more loses as many units as there were people; an uncut cell gains 1 in its first year of rest (max ' + p.maxLevel + '), stays the same in the second, and loses 1 in each further year'

      '<b>เจ้าหน้าที่อุทยาน:</b> ตั้งแต่ปีที่ ' + p.reserveFrom + ' ประกาศเขตอนุรักษ์ได้ไม่เกิน ' + p.reserveMax + ' ช่อง หรือไม่ประกาศก็ได้' + (p.enforce ? ' · <b>มีการลาดตระเวน:</b> ไม้ที่ตัดในเขตอนุรักษ์ถูกยึด (รายได้ 0)' : ' · เขตอนุรักษ์เป็นเพียงการประกาศ ไม่มีสิ่งใดห้ามเกษตรกรเข้าไปตัด (นับเป็นการบุกรุก)') + (p.plantMax ? ' · ปลูกป่าในช่องที่เป็น 0 ได้ปีละ ' + p.plantMax + ' ช่อง (กลายเป็น 1)' : ''),

  function goalsList(p) {

  /* ---------- 1. setup ---------- */

    return [
      ['suitMin', L('มวลชีวภาพต่ำสุดที่นกลงทำรัง', 'Lowest biomass where birds nest'), 1, 1, 3], ['maxHarvest', L('คนแรกตัดได้สูงสุด (หน่วย)', 'Most the first harvester can take (units)'), 1, 1, 3],
      ['chick1', L('สัดส่วนช่องรอบข้างที่เงียบ: ได้ลูก 1 ตัวเมื่อมากกว่า', 'Quiet-neighbour share: 1 chick when above'), 0.05, 0, 1], ['chick2', L('สัดส่วนช่องรอบข้างที่เงียบ: ได้ลูก 2 ตัวเมื่อตั้งแต่', 'Quiet-neighbour share: 2 chicks from'), 0.05, 0, 1],
      ['reserveMax', L('เขตอนุรักษ์สูงสุด (ช่อง)', 'Most reserve cells'), 1, 0, 20], ['reserveFrom', L('ประกาศเขตอนุรักษ์ได้ตั้งแต่ปีที่', 'Reserves allowed from year'), 1, 1, 10], ['years', L('จำนวนรอบ (ปี)', 'Rounds (years)'), 1, 1, 10]
    ];
  }
  function GOALS() { return [['income', L('เป้าหมายรายได้รวม (หน่วย)', 'Goal: total income (units)'), 1], ['chicksPerYear', L('เป้าหมายลูกนกต่อปี (ตัว)', 'Goal: chicks per year'), 1]]; }
  function EXT() { return [['enforce', L('ลาดตระเวน: ยึดไม้ที่ตัดในเขตอนุรักษ์', 'Patrols: wood cut in a reserve is confiscated'), 'bool'], ['homeIncome', L('รายได้อาชีพเสริมของคนที่อยู่บ้าน (หน่วย/คน/ปี)', 'Side-job income for those who stay home (units/person/year)'), 0.1], ['plantMax', L('ปลูกป่าได้ปีละ (ช่อง)', 'Replanting per year (cells)'), 1]]; }

  function renderSetup(P, s) {
    var started = s.inputs.length > 0, p = s.params, dis = started ? ' disabled' : '';
    var sess = store.order.map(function (id) {
      var x = store.sessions[id]; if (!x) return '';
      return '<div class="sess' + (id === store.active ? ' active' : '') + '"><div class="t"><b>' + esc(x.title) + '</b><div class="small muted">' + esc(SCEN(x.scenario)) + ' · ' + x.clans.length + L(' ครัวเรือน · เล่นแล้ว ', ' households · played ') + x.inputs.length + '/' + x.params.years + L(' ปี · ', ' years · ') + new Date(x.created).toLocaleDateString(locale()) + '</div></div>' +

        BOTKEYS.map(function (k) { return '<option value="' + k + '"' + (c.bot === k ? ' selected' : '') + '>' + L('บอท: ', 'Bot: ') + esc(BOTS(k)) + '</option>'; }).join('') + '</select></div>';
    }).join('');
    var pf = PARAMS().map(function (f) { return '<div><label for="p_' + f[0] + '">' + esc(f[1]) + '</label><input class="field" type="number" min="' + f[3] + '" max="' + f[4] + '" step="' + f[2] + '" id="p_' + f[0] + '" data-param="' + f[0] + '" value="' + p[f[0]] + '"' + dis + '></div>'; }).join('') +

    var ef = EXT().map(function (f) {
      if (f[2] === 'bool') return '<label class="check"><input type="checkbox" data-ext="' + f[0] + '"' + (p[f[0]] ? ' checked' : '') + dis + '> ' + esc(f[1]) + '</label>';
      return '<div><label for="e_' + f[0] + '">' + esc(f[1]) + '</label><input class="field" type="number" min="0" step="' + f[2] + '" id="e_' + f[0] + '" data-ext="' + f[0] + '" value="' + p[f[0]] + '"' + dis + '></div>';
    }).join('');
    var scenOpts = function (cur) { return ['S1', 'S2'].map(function (k) { return '<option value="' + k + '"' + (cur === k ? ' selected' : '') + '>' + esc(SCEN(k)) + '</option>'; }).join(''); };
    P.innerHTML =
      '<div class="banner info"><div>' + L('เกมสวมบทบาทสมมุติ: เกษตรกรส่งแรงงานไปตัดต้นไม้ในพื้นที่ป่า 20 ช่อง เจ้าหน้าที่อุทยานประกาศเขตอนุรักษ์ให้นกหายากทำรัง ผู้คุมเกมกรอกการตัดสินใจลงเครื่องนี้เครื่องเดียว แล้วฉายผลให้ทั้งห้องดู กติกาการคำนวณเป็นไปตามแบบจำลอง ReHab (Christophe Le Page &amp; Anne Dray, CIRAD) เขียนใหม่ให้เล่นบนเว็บได้ อ่านขั้นตอนทั้งหมดได้ในแท็บ <b>วิธีเล่น</b>',
        'A role-playing game: harvesters send their labour to cut trees in a forest of 20 cells, and park managers announce reserves where a rare bird can nest. The game master types everyone\'s decisions into this one computer and projects the results to the class. The rules follow the ReHab model (Christophe Le Page &amp; Anne Dray, CIRAD), reimplemented for the web. The full procedure is in the <b>How to play</b> tab.') + '</div></div>' +
      '<div class="two-col"><div class="card"><div class="sect-h"><h3>' + L('เกมในเครื่องนี้', 'Games in this browser') + '</h3></div>' + sess +
      '<h4 style="margin-top:1rem">' + L('เริ่มเกมใหม่', 'Start a new game') + '</h4><div class="pgrid">' +
      '<div><label for="nTitle">' + L('ชื่อเกม (เช่น ชื่อกลุ่ม)', 'Game name (e.g. group name)') + '</label><input class="field" id="nTitle" value="' + L('กลุ่ม A', 'Group A') + '"></div>' +
      '<div><label for="nScen">' + L('สถานการณ์', 'Scenario') + '</label><select id="nScen">' + scenOpts('S1') + '</select></div>' +
      '<div><label for="nClans">' + L('จำนวนครัวเรือน (5–20, แรงงานรวม 20 คนเสมอ)', 'Households (5–20; always 20 labour units in total)') + '</label><input class="field" type="number" id="nClans" min="5" max="20" value="5"></div></div>' +
      '<div class="actions" style="margin-top:.6rem"><button class="btn primary" id="bNew">' + L('เกมใหม่', 'New game') + '</button><button class="btn" id="bDemo">' + L('ทดลองกับบอททั้งหมด', 'Try with bots only') + '</button></div></div>' +
      '<div class="card"><div class="sect-h"><h3>' + L('เกมที่เปิดอยู่', 'Open game') + '</h3><span class="src">' + (started ? L('เล่นแล้ว ' + s.inputs.length + ' ปี ค่าพารามิเตอร์ถูกล็อก', s.inputs.length + ' year(s) played; parameters are locked') : L('ยังไม่เริ่ม', 'not started')) + '</span></div>' +
      '<div class="pgrid"><div><label for="sTitle">' + L('ชื่อเกม', 'Game name') + '</label><input class="field" id="sTitle" value="' + esc(s.title) + '"></div>' +
      '<div><label for="sScen">' + L('สถานการณ์', 'Scenario') + '</label><select id="sScen">' + scenOpts(s.scenario) + '</select></div></div>' +

      '<div class="card"><div class="sect-h"><h3>' + L('กติกาที่ใช้คำนวณ', 'Rules used for the calculation') + '</h3><span class="src">' + L('อ่านให้ผู้เล่นฟังก่อนเริ่ม', 'read them to the players before starting') + '</span></div>' + rulesHTML(p) +
      '<h4 style="margin-top:.8rem">' + L('วัตถุประสงค์ในการจัดการภูมิทัศน์ (สถานการณ์ที่ 2)', 'Landscape management objectives (scenario 2)') + '</h4><ul class="small" style="margin:.2rem 0 0 1.1rem;padding:0">' + goalsList(p).map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') + '</ul></div>' +
      '<details class="card"><summary><b>' + L('ปรับค่าพารามิเตอร์', 'Adjust parameters') + '</b> <span class="small muted">' + L('(ปรับได้ก่อนเริ่มปีที่ 1)', '(before year 1 only)') + '</span></summary><div class="pgrid" style="margin-top:.6rem">' + pf + '</div>' +
      '<h4 style="margin-top:1rem">' + L('ส่วนขยาย (ไม่มีในเกมต้นฉบับ ค่าเริ่มต้นปิดไว้)', 'Extensions (not in the original game; off by default)') + '</h4><div class="pgrid">' + ef + '</div>' +
      '<div class="actions" style="margin-top:.6rem"><button class="btn sm" id="bResetP"' + dis + '>' + L('คืนค่าเริ่มต้น', 'Reset to defaults') + '</button></div></details>';

    P.onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.open) { store.active = b.dataset.open; save(); render(); }
      else if (b.dataset.del) { if (!confirmInline(b, L('ยืนยันลบ', 'Confirm delete'))) return; var id = b.dataset.del; delete store.sessions[id]; store.order = store.order.filter(function (k) { return k !== id; }); if (store.active === id) store.active = store.order[0] || ''; if (!store.active) addSession(newSession({})); save(); render(); }
      else if (b.dataset.next) { var x = store.sessions[b.dataset.next]; var n = newSession({ title: x.title, scenario: 'S2', params: x.params, clans: x.params.clans, clanNames: x.clans.map(function (c) { return c.name; }), bots: x.clans.map(function (c) { return c.bot; }) }); addSession(n); render(); toast(L('เริ่มสถานการณ์ที่ 2 ของ ', 'Scenario 2 started for ') + x.title); }
      else if (b.id === 'bNew') { addSession(newSession({ title: $('#nTitle').value.trim() || L('เกมป่าชุมชน', 'Community forest game'), scenario: $('#nScen').value, clans: num($('#nClans').value, 5) })); store.tab = 1; render(); }

    };

      if (t.id === 'sTitle') { s.title = t.value.trim() || s.title; save(); render(); }
      else if (t.id === 'sScen') { s.scenario = t.value; save(); render(); }
      else if (t.dataset.clan != null) { s.clans[+t.dataset.clan].name = t.value.trim() || s.clans[+t.dataset.clan].name; save(); }
      else if (t.dataset.bot != null) { s.clans[+t.dataset.bot].bot = t.value; save(); }
      else if (started) return;
      else if (t.dataset.param) { s.params[t.dataset.param] = Math.max(0, num(t.value, s.params[t.dataset.param])); s.draft = null; save(); render(); }

  /* ---------- 2. play a year ---------- */
  function preview(s, d) {
    var p = s.params, st = stateOf(s), R = M.cleanReserve(p, d.year, d.reserve);
    var lv = st.levels.slice(); (d.plant || []).slice(0, p.plantMax).forEach(function (c) { if (lv[c - 1] === 0) lv[c - 1] = 1; });
    var birds = M.settle(p, lv), lab = new Array(M.nCells(p)).fill(0);
    d.choices.forEach(function (row) { row.forEach(function (c) { if (c >= 1 && c <= lab.length) lab[c - 1]++; }); });
    return { levels: lv, reserve: R, birds: birds, labour: lab, state: st };
  }
  function renderRound(P, s) {

          : '<p class="small muted">' + (p.reserveMax > 0 ? L('ปีที่ 1 ยังไม่มีเขตอนุรักษ์ เจ้าหน้าที่เริ่มประกาศได้ในปีที่ ' + p.reserveFrom, 'No reserves in year 1; park managers may announce them from year ' + p.reserveFrom) : L('เกมนี้ไม่มีเขตอนุรักษ์', 'This game has no reserves')) + '</p>') +
        (p.plantMax > 0 ? '<div class="pgrid"><div><label for="dPlant">' + L('ปลูกป่าในช่อง (ช่องที่เป็น 0, ไม่เกิน ' + p.plantMax + ' ช่อง)', 'Replant cells (cells at 0, at most ' + p.plantMax + ')') + '</label><input class="field" id="dPlant" value="' + esc((d.plant || []).join(' ')) + '"></div></div>' : '') + '</div>' +
        '<div class="card"><div class="sect-h"><h3>' + L('ขั้นที่ 2 นกลงทำรัง และสภาพพื้นที่ต้นปี', 'Step 2: birds nest; the forest at the start of the year') + '</h3><span class="src">' + L('มวลชีวภาพรวม ', 'total biomass ') + M.total(pv.levels) + '</span></div>' +

        '<div><p class="small">' + L('นกลงทำรังที่ช่อง ', 'Birds nest in cells ') + '<b>' + (pv.birds.length ? pv.birds.join(', ') : L('ไม่มี (ไม่มีช่องที่ต้นไม้มากพอ)', 'none (no cell has enough trees)')) + '</b> (' + pv.birds.length + L(' คู่', ' pairs') + ')</p><p class="small muted">' + L('ตัวเลข ◇ บนแผนที่คือจำนวนแรงงานที่กรอกไว้แล้ว (ยังไม่คำนวณ) ใช้ตรวจก่อนกดคำนวณ', 'The ◇ numbers on the map are the labour typed so far (not yet calculated); check them before you calculate') + '</p>' +

        '<div class="card"><div class="sect-h"><h3>' + L('ขั้นที่ 3 เกษตรกรเลือกช่องที่จะไปตัด', 'Step 3: harvesters choose where to cut') + '</h3><div class="actions">' + (bots ? '<button class="btn sm" id="bBots">' + L('เติมช่องของบอท', 'Fill bot cells') + '</button>' : '') + (R.length ? '<button class="btn sm" id="bSame">' + L('ใช้ช่องเดิมเหมือนปีก่อน', 'Same cells as last year') + '</button>' : '') + '<button class="btn sm" id="bClear">' + L('ล้าง', 'Clear') + '</button></div></div>' +

        '<div class="scroll-x"><table class="res choice-t"><thead><tr><th>' + L('ครัวเรือน', 'Household') + '</th>' + Array.from({ length: maxSize(p) }, function (_, m) { return '<th>M' + (m + 1) + '</th>'; }).join('') + '<th>' + L('ผู้เล่น', 'Player') + '</th></tr></thead><tbody>' +
        s.clans.map(function (c, hh) {

            return '<td><input class="field" type="number" inputmode="numeric" min="0" max="' + M.nCells(p) + '" data-h="' + hh + '" data-m="' + m + '" value="' + (v || 0) + '" aria-label="H' + (hh + 1) + '-M' + (m + 1) + '"></td>'; }).join('') + new Array(maxSize(p) - d.choices[hh].length + 1).join('<td></td>') +

        }).join('') + '</tbody></table></div>' +
        '<div class="actions" style="margin-top:.8rem"><button class="btn primary" id="bRun">' + L('คำนวณผลปีที่ ', 'Calculate year ') + d.year + '</button></div></div>';
    } else {
      h += '<div class="banner info"><div>' + L('เล่นครบแล้ว ไปที่แท็บ <b>สรุปผล</b> เพื่อดูว่าบรรลุวัตถุประสงค์หรือไม่ หรือเริ่มสถานการณ์ที่ 2 ในแท็บเตรียมเกม', 'Finished. Open the <b>Results</b> tab to see whether the objectives were met, or start scenario 2 in the Setup tab.') + '</div></div>';

    function refreshPreview() {
      var pv = preview(s, d), b = $('#dBoard'); if (!b) return;

    };
    P.onchange = function (e) {

      else if (t.id === 'dPlant') { d.plant = parseCells(t.value, M.nCells(p)).slice(0, p.plantMax); save(); render(); }
    };
    P.onclick = function (e) {
      var cell = e.target.closest('#dBoard [data-cell]');

      }

      if (b.id === 'bBots') { fillBots(s, d); save(); render(); toast(L('เติมช่องของบอทแล้ว', 'Bot cells filled')); }
      else if (b.id === 'bSame') { var prev = s.inputs[s.inputs.length - 1]; d.choices = prev.choices.map(function (r) { return r.slice(); }); save(); render(); }
      else if (b.id === 'bClear') { d.choices = emptyChoices(p); save(); render(); }
      else if (b.id === 'bRun') { runYear(s, d); }
      else if (b.id === 'bUndo') { if (!confirmInline(b, L('ยืนยันย้อน', 'Confirm undo'))) return; var inp = s.inputs.pop(); s.draft = { year: s.inputs.length + 1, reserve: inp.reserve || [], choices: inp.choices, plant: inp.plant || [] }; save(); render(); toast(L('ย้อนกลับไปแก้ปีที่ ', 'Back to edit year ') + s.draft.year); }
      else if (b.id === 'bPresRes') presenter();

  }
  function fillBots(s, d) {
    var p = s.params, pv = preview(s, d), u = M.rng(1000 * s.inputs.length + s.created.length + d.year * 7);
    var kinds = {}; s.clans.forEach(function (c) { if (c.bot) kinds[c.bot] = true; });
    var mats = {}; Object.keys(kinds).forEach(function (k) { mats[k] = M.bot(k, p, pv.levels, pv.birds, pv.reserve, u); });
    s.clans.forEach(function (c, h) { if (c.bot) d.choices[h] = mats[c.bot][h].slice(); });
  }
  function runYear(s, d) {
    var p = s.params;
    if (s.clans.some(function (c, h) { return c.bot && d.choices[h].every(function (v) { return !v; }); })) fillBots(s, d);
    s.inputs.push({ reserve: M.cleanReserve(p, d.year, d.reserve), choices: d.choices.map(function (r) { return r.slice(); }), plant: (d.plant || []).slice() });
    s.draft = null; save(); render(); window.scrollTo(0, 0); toast(L('คำนวณผลปีที่ ' + d.year + ' แล้ว', 'Year ' + d.year + ' calculated'));
  }
  function resultCard(s, r, R) {
    var p = s.params, cum = new Array(p.clans).fill(0);
    R.forEach(function (x) { x.clanIncome.forEach(function (v, i) { cum[i] += v; }); });
    return '<div class="card" id="resCard"><div class="sect-h"><h3>' + L('ผลปีที่ ', 'Results of year ') + r.year + '</h3><div class="actions"><button class="btn sm primary" id="bPresRes">' + L('▶ ฉายผล', '▶ Project results') + '</button><button class="btn sm" id="bUndo">' + L('↶ ย้อน (ปีนี้)', '↶ Undo (this year)') + '</button></div></div>' +
      '<div class="kpi"><div class="box"><div class="v">' + fmt(r.income) + '</div><div class="l">' + L('รายได้รวมปีนี้ (หน่วย)', 'income this year (units)') + '</div></div><div class="box"><div class="v">' + r.chicks + '</div><div class="l">' + L('ลูกนกเกิดใหม่ (ตัว)', 'chicks born') + '</div></div>' +
      '<div class="box"><div class="v">' + r.totalBefore + ' → ' + r.totalAfter + '</div><div class="l">' + L('มวลชีวภาพรวม ต้นปี → ปีหน้า', 'total biomass, this year → next year') + '</div></div><div class="box"><div class="v">' + r.invaders + '</div><div class="l">' + L('แรงงานที่เข้าเขตอนุรักษ์', 'labour inside reserves') + '</div></div></div>' +
      '<div class="two-col" style="margin-top:.8rem"><div><h4>' + L('ขณะตัด (ลูกนกที่เกิด)', 'During the harvest (chicks born)') + '</h4>' + board(p, { levels: r.before, reserve: r.reserve, birds: r.birds, labour: r.labour, nests: r.nests }) + '</div>' +
      '<div><h4>' + L('หลังฟื้นตัว (สภาพต้นปีหน้า)', 'After regrowth (start of next year)') + '</h4>' + board(p, { levels: r.after, reserve: r.reserve }) + '</div></div>' + legend() +
      '<div class="two-col"><div class="scroll-x"><table class="res"><thead><tr><th>' + L('ครัวเรือน', 'Household') + '</th>' + Array.from({ length: maxSize(p) }, function (_, m) { return '<th>M' + (m + 1) + L(' ช่อง/ได้', ' cell/got') + '</th>'; }).join('') + '<th>' + L('ปีนี้', 'This year') + '</th><th>' + L('สะสม', 'Cumulative') + '</th></tr></thead><tbody>' +
      s.clans.map(function (c, h) { return '<tr><td>H' + (h + 1) + ' ' + esc(c.name) + '</td>' + r.choices[h].map(function (cell, m) { return '<td>' + (cell ? cell + ' / ' + fmt(r.yields[h][m]) : L('บ้าน', 'home') + (r.yields[h][m] ? ' / ' + fmt(r.yields[h][m]) : '')) + '</td>'; }).join('') + new Array(maxSize(p) - r.choices[h].length + 1).join('<td></td>') + '<td><b>' + fmt(r.clanIncome[h]) + '</b></td><td>' + fmt(cum[h]) + '</td></tr>'; }).join('') +
      '<tr class="total"><td>' + L('รวม', 'Total') + '</td>' + Array.from({ length: maxSize(p) }, function () { return '<td></td>'; }).join('') + '<td>' + fmt(r.income) + '</td><td>' + fmt(cum.reduce(function (a, b) { return a + b; }, 0)) + '</td></tr></tbody></table></div>' +
      '<div class="scroll-x"><table class="res"><thead><tr><th>' + L('รังนก (ช่อง)', 'Nest (cell)') + '</th><th>' + L('คนในช่อง', 'People in cell') + '</th><th>' + L('ช่องรอบข้างที่ไม่มีคนตัด', 'Quiet neighbours') + '</th><th>' + L('สัดส่วน', 'Share') + '</th><th>' + L('ลูกนก', 'Chicks') + '</th></tr></thead><tbody>' +
      (r.nests.length ? r.nests.map(function (n) { return '<tr><td>' + n.cell + '</td><td>' + n.harvesters + '</td><td>' + n.quiet + '/' + n.neighbours + '</td><td>' + fmt(n.ratio, 2) + '</td><td><b>' + n.chicks + '</b></td></tr>'; }).join('') : '<tr><td colspan="5">' + L('ไม่มีนกลงทำรัง', 'No birds nested') + '</td></tr>') +
      '</tbody></table></div></div></div>';
  }

  /* ---------- 3. record sheets (textbook appendix 10, item 8) ---------- */
  function sheetHarvest(s, R, blank) {
    var p = s.params, Y = p.years;
    var head = '<tr><th rowspan="3">Harvester (House)<br>number</th><th colspan="' + (2 * Y) + '">Results</th><th rowspan="3">Cumulative<br>harvested biomass</th></tr><tr>' +
      Array.from({ length: Y }, function (_, y) { return '<th colspan="2">Year ' + (y + 1) + '</th>'; }).join('') + '</tr><tr>' + Array.from({ length: Y }, function () { return '<th>cell</th><th>biomass</th>'; }).join('') + '</tr>';
    var body = '';
    for (var h = 0; h < p.clans; h++) for (var m = 0; m < p.sizes[h]; m++) {
      var tot = 0, tds = '';
      for (var y = 0; y < Y; y++) { var r = !blank && R[y]; if (r) { var c = r.choices[h][m], v = r.yields[h][m]; tot += v; tds += '<td>' + (c || '–') + '</td><td>' + (c || v ? fmt(v) : '') + '</td>'; } else tds += '<td></td><td></td>'; }
      body += '<tr><td class="l">H' + (h + 1) + '-M' + (m + 1) + (blank ? '' : ' <span class="small muted">' + esc(s.clans[h].name) + '</span>') + '</td>' + tds + '<td>' + (!blank && R.length ? fmt(tot) : '') + '</td></tr>';
    }
    return '<table class="sheet-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table><p class="small">* H = House ID (clan) of harvester, M = member (or labour)</p>';
  }
  function sheetPark(s, R, blank) {
    var p = s.params, Y = p.years, cum = 0;
    var cells = Array.from({ length: Y }, function (_, y) { var r = !blank && R[y]; return '<td>' + (r ? (r.reserve.length ? r.reserve.join(' ') : '–') : '') + '</td>'; }).join('');
    var ch = Array.from({ length: Y }, function (_, y) { var r = !blank && R[y]; if (r) cum += r.chicks; return '<td>' + (r ? r.chicks : '') + '</td>'; }).join('');
    return '<table class="sheet-table"><thead><tr><th rowspan="2"></th><th colspan="' + Y + '">Result</th><th rowspan="2">' + L('Cumulative number (จำนวนตัวสะสม)', 'Cumulative number') + '</th></tr><tr>' +
      Array.from({ length: Y }, function (_, y) { return '<th>Year ' + (y + 1) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      '<tr><td class="l">' + L('เขตอนุรักษ์<br><span class="small">(เลขช่องที่อนุรักษ์หลังตกลงกัน)</span>', 'Reserve<br><span class="small">(cell numbers agreed)</span>') + '</td>' + cells + '<td></td></tr>' +
      '<tr><td class="l">' + L('จำนวนลูกนก', 'Number of chicks') + '</td>' + ch + '<td>' + (!blank && R.length ? cum : '') + '</td></tr></tbody></table>';
  }
  function yearMaps(s, R) {
    var p = s.params;
    return '<div class="years5">' + R.map(function (r) { return '<div><div class="yh">' + L('ปีที่ ' + r.year + ' · ' + r.totalBefore + ' หน่วย · ลูกนก ' + r.chicks, 'Year ' + r.year + ' · ' + r.totalBefore + ' units · chicks ' + r.chicks) + '</div>' + board(p, { levels: r.before, reserve: r.reserve, birds: r.birds, labour: r.labour, nests: r.nests, small: true }) + '</div>'; }).join('') +
      (R.length ? '<div><div class="yh">' + L('หลังจบเกม · ', 'After the game · ') + R[R.length - 1].totalAfter + L(' หน่วย', ' units') + '</div>' + board(p, { levels: R[R.length - 1].after, small: true }) + '</div>' : '') + '</div>';
  }
  function renderSheets(P, s) {

      (R.length ? '<div class="card"><div class="sect-h"><h3>' + L('ภูมิทัศน์แต่ละปี', 'Landscape each year') + '</h3></div>' + yearMaps(s, R) + legend() + '</div>' : '');
    P.onclick = function (e) {

          '<h3>' + L('เกษตรกร (Harvester: H)', 'Harvesters (H)') + '</h3>' + sheetHarvest(s, R, blank) + '<h3>' + L('นักอนุรักษ์ (Park manager)', 'Park managers') + '</h3>' + sheetPark(s, R, blank) +
          (!blank && R.length ? '<h3 class="page-break">' + L('ภูมิทัศน์แต่ละปี', 'Landscape each year') + '</h3>' + yearMaps(s, R) : '') + '</section>';
        setTimeout(function () { window.print(); }, 50);

  function tx(o) { return L(o.th, o.en); }
  function citeA10(n) { return L('ภาคผนวกที่ 10 ข้อ ' + n, 'Textbook appendix 10, item ' + n + ' (translated)'); }

  /* answers (PD, 18 Oct 2026): students type their answers under each question, choose the scenario(s) they
     played, and print the answer sheet to PDF for MyCourseVille. Stored in the game: s.answers =
     { group, members, played: 'S1' | 'S2' | 'both', q: { '<id>': text } }. Part A = after scenario 1
     (questions 1–7), part B = after the game (questions 9.1–9.7). mode: 'web' (inputs), 'blank' (worksheet
     with empty lines), 'ans' (answer sheet with the typed answers). */
  function answersOf(s) {
    var a = s.answers && typeof s.answers === 'object' ? s.answers : {};
    if (typeof a.q !== 'object' || !a.q) a.q = {};
    if (['S1', 'S2', 'both'].indexOf(a.played) < 0) a.played = s.scenario === 'S2' ? 'both' : 'S1';
    a.group = a.group || ''; a.members = a.members || '';
    s.answers = a; return a;
  }
  function partOn(a, part) { return part === 'A' ? a.played !== 'S2' : a.played !== 'S1'; }
  function ansText(v) { return v ? esc(v).replace(/\n/g, '<br>') : '<span class="muted">–</span>'; }
  function field(id, rows, A, mode, ph) {
    if (mode === 'web') return '<textarea class="ans-ta" data-ans="' + id + '" rows="' + rows + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>' + esc(A[id] || '') + '</textarea>';
    if (mode === 'ans') return '<div class="ans-out">' + ansText(A[id]) + '</div>';
    return '';
  }
  function qTable(q, mode, A) {
    var t = q.table, n = t.rows || 5, cols = t.head.length, yearCol = cols === 3;
    var cg = '<colgroup>' + t.w.map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>';
    var body = '';
    for (var i = 0; i < n; i++) body += '<tr>' + t.head.map(function (_, j) {
      if (yearCol && j === 0) return '<td>' + (i + 1) + '</td>';
      var id = q.n + '_r' + (i + 1) + 'c' + (j + 1), ph = j === 2 && t.cell3 ? tx(t.cell3).replace('<br>', ' / ') : '';
      if (mode === 'web') return '<td class="ta-cell">' + field(id, 2, A, mode, ph) + '</td>';
      if (mode === 'ans') return '<td class="l">' + (A[id] ? esc(A[id]).replace(/\n/g, '<br>') : '') + '</td>';
      return '<td style="height:' + (yearCol ? 15 : 11) + 'mm">' + (j === 2 && t.cell3 ? '<span class="small">' + tx(t.cell3) + '</span>' : '') + '</td>';
    }).join('') + '</tr>';
    return '<div class="scroll-x"><table class="sheet-table qtab">' + cg + '<thead><tr>' + t.head.map(function (h) { return '<th>' + tx(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  function ansLines(n) { return '<div class="ans-lines">' + new Array(n + 1).join('<div class="ans"></div>') + '</div>'; }
  function qItem(q, mode, A) {
    var h = '<li class="dq" value="' + parseInt(q.n.split('.').pop(), 10) + '"><div>' + tx(q) + '</div>';
    if (q.sub) h += '<ol type="a" class="dsub">' + q.sub.map(function (x, i) { var id = q.n + 'abc'[i]; return '<li>' + tx(x) + (mode === 'blank' ? ansLines(q.lines || 2) : field(id, 2, A, mode)) + '</li>'; }).join('') + '</ol>';
    if (q.list) h += '<ul>' + q.list.map(function (x) { return '<li>' + tx(x) + '</li>'; }).join('') + '</ul>';
    if (q.after) h += '<div>' + tx(q.after) + '</div>';
    if (q.note) h += '<div class="small"><b>' + tx(q.note) + '</b></div>';
    if (q.table) h += qTable(q, mode, A);
    if (!q.sub && !q.table) {
      if (mode === 'blank') h += q.box ? '<div class="ans-box" style="height:' + q.box + 'mm"></div>' : ansLines(q.lines || 3);
      else h += field(q.n, q.box ? 6 : Math.max(3, (q.lines || 3) + 1), A, mode, q.box ? L('อธิบายแผนภาพเป็นข้อความ (องค์ประกอบ → กริยา → องค์ประกอบ) หรือวาดลงกระดาษแล้วแนบรูปในระบบ', 'Describe the diagram as text (component → verb → component), or draw it on paper and attach a photo in the system') : '');
    }
    return h + '</li>';
  }

      en: '<u>The first group</u> is the harvesters (4–20 households, depending on the number of players). They send the labour of their household (1–4 people, depending on the number of players) into the forest to harvest biomass (imagine cutting trees) and sell it for income. Players decide which cell (1–20) to send each labour unit to, write it in a table and give the reason for choosing that cell (textbook Fig. 8.65). One labour unit can harvest at most 2 units of biomass, and if several labour units harvest in the same cell, the computer decides who gets how much.' },

      en: '<u>The second group</u> is the national park officers or conservationists (park managers: 2–3 people, depending on the number of players) (textbook Fig. 8.66). Their task is to conserve the forest as a nesting area for a rare, endangered bird. The birds choose areas rich enough to come down, build nests and lay eggs (settlement), but their breeding success depends on the level of disturbance: with little disturbance, 1 or 2 chicks are born (the park managers must watch the details while playing). Park managers may announce up to 3 reserve cells, starting from round 2, and record them in the record sheet.' },

  function howtoDiff(s) {
    var D = M.params({ clans: s.params.clans }), p = s.params, out = [];
    PARAMS().forEach(function (f) { if (p[f[0]] !== D[f[0]]) out.push(f[1] + ' ' + D[f[0]] + ' → ' + p[f[0]]); });
    GOALS().forEach(function (f) { if (p.goals[f[0]] !== D.goals[f[0]]) out.push(f[1] + ' ' + D.goals[f[0]] + ' → ' + p.goals[f[0]]); });
    EXT().forEach(function (f) { if (p[f[0]] !== D[f[0]]) out.push(L('ส่วนขยาย: ', 'Extension: ') + f[1] + (f[2] === 'bool' ? '' : ' ' + D[f[0]] + ' → ' + p[f[0]])); });
    if (p.clans !== M.DEFAULTS.clans) out.push(L('จำนวนครัวเรือน ', 'Households ') + M.DEFAULTS.clans + ' → ' + p.clans + ' (' + p.sizes.join(', ') + L(' คน)', ' people)'));
    return out;
  }

  function renderHowto(P, s) {
    P.innerHTML = '<div class="card howto"><div class="sect-h"><span></span><div class="actions"><button class="btn sm" id="bRules">' + L('🖨 พิมพ์กติกา', '🖨 Print rules') + '</button></div></div>' + howtoBody(s) + '</div>';
    P.onclick = function (e) { if (e.target.closest('#bRules')) printRules(s); };
  }
  function printRules(s) {
    $('#printArea').innerHTML = '<section class="rulesp">' + howtoBody(s) + '</section>';
    setTimeout(function () { window.print(); }, 50);
  }

  /* ---------- presenter ---------- */
  function presenter() {
    var s = S(), p = s.params, R = rows(s), last = R[R.length - 1], el = $('#pres'), d = ensureDraft(s), sm = M.summary(p, R);
    var body;
    if (last) body = '<h1>' + esc(s.title) + L(' · ผลปีที่ ', ' · results of year ') + last.year + '</h1><div class="two-col"><div>' + board(p, { levels: last.before, reserve: last.reserve, birds: last.birds, labour: last.labour, nests: last.nests }) + '</div>' +
      '<div><div class="kpi"><div class="box"><div class="v">' + fmt(last.income) + '</div><div class="l">' + L('รายได้ปีนี้', 'income this year') + '</div></div><div class="box"><div class="v">' + last.chicks + '</div><div class="l">' + L('ลูกนกปีนี้', 'chicks this year') + '</div></div><div class="box"><div class="v">' + fmt(sm.income) + '</div><div class="l">' + L('รายได้สะสม', 'cumulative income') + '</div></div><div class="box"><div class="v">' + last.totalAfter + '</div><div class="l">' + L('มวลชีวภาพปีหน้า', 'biomass next year') + '</div></div></div>' +
      '<h3 style="margin-top:1rem">' + L('ต้นปีหน้า', 'Start of next year') + '</h3>' + board(p, { levels: last.after, reserve: last.reserve, small: true }) + '</div></div>';
    else { var pv = preview(s, d); body = '<h1>' + esc(s.title) + L(' · ก่อนเริ่มปีที่ 1', ' · before year 1') + '</h1>' + board(p, { levels: pv.levels, reserve: pv.reserve, birds: pv.birds }); }
    el.innerHTML = '<div class="pres-in"><div class="sect-h"><div><div class="tag">' + esc(SCEN(s.scenario)) + '</div></div><div class="actions"><button class="btn" id="pFull">' + L('เต็มจอ', 'Full screen') + '</button><button class="btn primary" id="pX">' + L('ปิด (Esc)', 'Close (Esc)') + '</button></div></div>' + body + legend() + '</div>';
    el.classList.add('show'); document.body.style.overflow = 'hidden';
    function close() { el.classList.remove('show'); document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); if (document.fullscreenElement) document.exitFullscreen().catch(function () {}); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    $('#pX').onclick = close; document.addEventListener('keydown', onKey);
    $('#pFull').onclick = function () { if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); };
  }

  /* ---------- 6. downloads ---------- */
  function download(name, text, type) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  // ASCII-only file names: some browsers drop a Thai download name and save as "download"
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fileBase(s, tag) { var slug = (s.title || '').replace(/[^A-Za-z0-9-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 24); return 'W12' + (slug ? '_' + slug : '') + '_' + (tag || s.scenario) + '_' + today(); }
  function csvText(t) { return '﻿' + t.map(function (r) { return r.map(function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n'); }
  var EXPORTS = [
    { id: 'labour', name: ['ผลรายแรงงานรายปี', 'Per labour unit per year'], desc: ['หนึ่งแถวต่อแรงงานต่อปี: ช่องที่เลือก อยู่ในเขตอนุรักษ์หรือไม่ มวลชีวภาพที่ตัดได้', 'One row per labour unit per year: cell chosen, inside a reserve or not, biomass harvested'],
      head: [['สถานการณ์', 'scenario'], ['ปี', 'year'], ['ครัวเรือน', 'house'], ['ชื่อครัวเรือน', 'house_name'], ['แรงงาน', 'member'], ['ช่อง', 'cell'], ['ในเขตอนุรักษ์', 'in_reserve'], ['คนในช่องเดียวกัน', 'labour_in_cell'], ['มวลชีวภาพที่ได้', 'biomass']],
      rows: function (x, R) { var o = []; R.forEach(function (r) { r.choices.forEach(function (row, h) { row.forEach(function (c, m) { o.push([x.scenario, r.year, 'H' + (h + 1), x.clans[h].name, 'M' + (m + 1), c || 0, c && r.reserve.indexOf(c) >= 0 ? 1 : 0, c ? r.labour[c - 1] : '', r.yields[h][m]]); }); }); }); return o; } },
    { id: 'house', name: ['รายได้รายครัวเรือนรายปี', 'Income per household per year'], desc: ['หนึ่งแถวต่อครัวเรือนต่อปี: รายได้ปีนั้นและรายได้สะสม', 'One row per household per year: income that year and cumulative income'],
      head: [['สถานการณ์', 'scenario'], ['ปี', 'year'], ['ครัวเรือน', 'house'], ['ชื่อครัวเรือน', 'house_name'], ['แรงงานที่ออกไปตัด', 'labour_out'], ['รายได้', 'income'], ['รายได้สะสม', 'income_cum']],
      rows: function (x, R) { var o = [], cum = x.clans.map(function () { return 0; }); R.forEach(function (r) { r.clanIncome.forEach(function (v, h) { cum[h] += v; o.push([x.scenario, r.year, 'H' + (h + 1), x.clans[h].name, r.choices[h].filter(function (c) { return c; }).length, v, Math.round(cum[h] * 100) / 100]); }); }); return o; } },
    { id: 'cell', name: ['ภูมิทัศน์รายช่องรายปี', 'Landscape per cell per year'], desc: ['หนึ่งแถวต่อช่องต่อปี: มวลชีวภาพต้นปี แรงงาน ที่ถูกตัด นก การรบกวน ลูกนก มวลชีวภาพปีหน้า', 'One row per cell per year: biomass at the start, labour, harvested, bird, disturbance, chicks, biomass next year'],
      head: [['สถานการณ์', 'scenario'], ['ปี', 'year'], ['ช่อง', 'cell'], ['มวลชีวภาพต้นปี', 'biomass_start'], ['เขตอนุรักษ์', 'reserve'], ['แรงงาน', 'labour'], ['ตัดได้รวม', 'harvested'], ['มีนก', 'bird'], ['สัดส่วนช่องรอบข้างที่เงียบ', 'quiet_share'], ['ลูกนก', 'chicks'], ['ปีที่ไม่มีคนตัดติดกัน', 'rest_years'], ['มวลชีวภาพปีหน้า', 'biomass_next']],
      rows: function (x, R) { var o = []; R.forEach(function (r) { r.before.forEach(function (v, i) { var c = i + 1, n = r.nests.find(function (q) { return q.cell === c; }); o.push([x.scenario, r.year, c, v, r.reserve.indexOf(c) >= 0 ? 1 : 0, r.labour[i], r.taken[i], n ? 1 : 0, n ? n.ratio : '', n ? n.chicks : '', r.rest[i], r.after[i]]); }); }); return o; } },
    { id: 'sum', name: ['สรุปผลต่อเกม', 'Summary per game'], desc: ['หนึ่งแถวต่อเกม: รายได้รวม ส่วนต่างรายได้ Gini ลูกนก มวลชีวภาพ และการบรรลุเป้าหมาย', 'One row per game: total income, income gap, Gini, chicks, biomass and the goals met'],
      head: [['เกม', 'game'], ['สถานการณ์', 'scenario'], ['ปีที่เล่น', 'years'], ['รายได้รวม', 'income_total'], ['ส่วนต่างรายได้', 'income_gap'], ['Gini', 'gini'], ['ลูกนกรวม', 'chicks_total'], ['ลูกนกรายปี', 'chicks_by_year'], ['มวลชีวภาพเริ่ม', 'biomass_start'], ['มวลชีวภาพจบ', 'biomass_end'], ['บุกรุกเขตอนุรักษ์', 'reserve_intrusions'], ['บรรลุรายได้', 'goal_income'], ['บรรลุลูกนก', 'goal_chicks'], ['บรรลุมวลชีวภาพ', 'goal_biomass']],
      rows: function (x, R) { var m = M.summary(x.params, R); return [[x.title, x.scenario, m.years, m.income, m.gap, m.gini, m.chicks, m.chicksByYear.join(' '), m.biomassStart, m.biomassEnd, m.invaders, m.goal.income ? 1 : 0, m.goal.chicks ? 1 : 0, m.goal.biomass ? 1 : 0]]; } }
  ];
  function table(ex, list, th) { var t = [ex.head.map(function (h) { return th ? h[0] : h[1]; })]; list.forEach(function (x) { var R = rows(x); t = t.concat(ex.rows(x, R)); }); return t; }
  function nAns(s) { var q = (s.answers && s.answers.q) || {}; return Object.keys(q).filter(function (k) { return String(q[k]).trim(); }).length; }
  function renderDownloads(P, s) {
    var th = (store.csvLang || LANG) !== 'en', has = s.inputs.length > 0;
    var same = store.order.map(function (k) { return store.sessions[k]; }).filter(function (x) { return x && x.inputs.length && x.title === s.title; });
    var ex = EXPORTS.find(function (e) { return e.id === (store.csvPrev || 'house'); }) || EXPORTS[1];
    var prev = has ? table(ex, [s], th).slice(0, 8) : [];
    P.innerHTML =
      '<div class="card"><div class="sect-h"><h3>' + L('ดาวน์โหลดผลของเกมเป็นไฟล์ CSV', 'Download the results as CSV files') + '</h3><span class="src">' + esc(s.title + ' · ' + SCEN(s.scenario)) + ' · ' + L('เล่นแล้ว ' + s.inputs.length + ' ปี', s.inputs.length + ' year(s) played') + '</span></div>' +
      '<p class="small muted">' + L('เปิดใน Excel หรือ Google Sheets ได้ทันที (UTF-8 อ่านภาษาไทยได้) หน่วย: มวลชีวภาพ (หน่วย) และลูกนก (ตัว)', 'Opens directly in Excel or Google Sheets (UTF-8). Units: biomass (units) and chicks (birds).') + '</p>' +
      '<label class="lbl">' + L('หัวคอลัมน์', 'Column headers') + '</label><div class="seg" style="max-width:440px"><button data-lang="th" class="' + (th ? 'on' : '') + '">' + L('ภาษาไทย (Excel)', 'Thai (Excel)') + '</button><button data-lang="en" class="' + (th ? '' : 'on') + '">English (R / Python)</button></div>' +
      (has ? '' : '<div class="banner warn">' + L('ยังไม่มีผล เล่นอย่างน้อย 1 ปีก่อน', 'No results yet; play at least one year') + '</div>') +
      '<table class="list"><thead><tr><th>' + L('ไฟล์', 'File') + '</th><th>' + L('เกมนี้', 'This game') + '</th><th>' + L('ทุกสถานการณ์ของ "', 'All scenarios of "') + esc(s.title) + '" (' + same.length + ')</th></tr></thead><tbody>' +
      EXPORTS.map(function (e) { return '<tr><td><b>' + esc(L(e.name[0], e.name[1])) + '</b><div class="small muted">' + esc(L(e.desc[0], e.desc[1])) + '</div></td><td><button class="btn sm primary" data-dl="' + e.id + '"' + (has ? '' : ' disabled') + '>⬇ CSV</button></td><td><button class="btn sm" data-dlall="' + e.id + '"' + (same.length ? '' : ' disabled') + '>' + L('⬇ CSV รวม', '⬇ CSV (all)') + '</button></td></tr>'; }).join('') +
      '<tr><td><b>' + L('คำตอบคำถามอภิปราย (PDF)', 'Discussion answers (PDF)') + '</b><div class="small muted">' + L('คำตอบที่พิมพ์ในแท็บคำถามอภิปราย สำหรับส่งในระบบ MyCourseVille (เลือก "บันทึกเป็น PDF" ในหน้าต่างพิมพ์) · ตอบแล้ว ', 'Answers typed in the Discussion tab, for submitting in MyCourseVille (choose “Save as PDF” in the print window) · answered ') + nAns(s) + L(' ช่อง', ' fields') + '</div></td><td><button class="btn sm primary" id="dlAns">🖨 PDF</button></td><td><button class="btn sm" id="goDisc">' + L('ไปที่คำถามอภิปราย', 'Open Discussion') + '</button></td></tr>' +
      '<tr><td><b>' + L('ไฟล์สำรองทั้งเกม (JSON)', 'Full game backup (JSON)') + '</b><div class="small muted">' + L('เก็บไว้เปิดต่อหรือย้ายเครื่องด้วยปุ่ม ⬆ นำเข้า JSON ด้านบน', 'Keep it to continue later or move to another computer with ⬆ Import JSON at the top') + '</div></td><td><button class="btn sm" id="dlJson">⬇ JSON</button></td><td><button class="btn sm" id="dlJsonAll">' + L('⬇ JSON ทุกเกมในเครื่อง', '⬇ JSON (all games)') + '</button></td></tr></tbody></table></div>' +
      (prev.length > 1 ? '<div class="card"><div class="sect-h"><h3>' + L('ตัวอย่างข้อมูล', 'Data preview') + '</h3><div class="actions">' + EXPORTS.map(function (e) { return '<button class="btn sm' + (e.id === ex.id ? ' primary' : '') + '" data-prev="' + e.id + '">' + esc(L(e.name[0], e.name[1])) + '</button>'; }).join('') + '</div></div>' +
        '<div class="scroll-x"><table class="res"><thead><tr>' + prev[0].map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        prev.slice(1).map(function (r) { return '<tr>' + r.map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div></div>' : '');
    P.onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.lang) { store.csvLang = b.dataset.lang; store.csvLangAuto = false; save(); render(); }
      else if (b.dataset.prev) { store.csvPrev = b.dataset.prev; save(); render(); }
      else if (b.dataset.dl || b.dataset.dlall) {
        var all = !!b.dataset.dlall, x = EXPORTS.find(function (q) { return q.id === (b.dataset.dl || b.dataset.dlall); });
        var name = fileBase(s, all ? 'all' : '') + '_' + ({ labour: 'labour-year', house: 'house-year', cell: 'cell-year', sum: 'summary' })[x.id] + '.csv';
        download(name, csvText(table(x, all ? same : [s], th)), 'text/csv;charset=utf-8'); toast(L('ดาวน์โหลด ', 'Downloaded ') + name);
      }
      else if (b.id === 'dlAns') printAnswers(s);
      else if (b.id === 'goDisc') { store.tab = 4; save(); render(); window.scrollTo(0, 0); }
      else if (b.id === 'dlJson') download(fileBase(s) + '.json', JSON.stringify(s, null, 1), 'application/json');
      else if (b.id === 'dlJsonAll') download('W12_all-games_' + today() + '.json', JSON.stringify(store, null, 1), 'application/json');
    };
  }

  $('#bExport').onclick = function () { var s = S(); download(fileBase(s) + '.json', JSON.stringify(s, null, 1), 'application/json'); };
  // Import: one game, the whole store (⬇ JSON all games) or a {schema:'…-game-file', game} wrapper; files of the
  // textbook app (same schema mnrm-forest) open here too. Asks first when the open game has played years.
  $('#bImport').onclick = function () { var s = S(); if (s && s.inputs.length && !confirmInline(this, L('แทนเกมที่เปิดอยู่', 'Replace the open game'))) return; $('#fImport').click(); };
  $('#fImport').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (txt) {
      var data = JSON.parse(txt); if (data && data.game && /-game-file$/.test(data.schema || '')) data = data.game;
      var list = data && data.sessions ? Object.keys(data.sessions).map(function (k) { return data.sessions[k]; }) : [data];
      list = list.filter(function (x) { return x && x.schema === M.SCHEMA; });
      if (!list.length) { toast(L('ไฟล์นี้ไม่ใช่ข้อมูลของเกมป่าชุมชน', 'This file is not a community forest game')); return; }
      list.forEach(function (x) { normalize(x); if (store.sessions[x.id]) x.id = x.id + '_' + Date.now().toString(36); addSession(x); });
      store.tab = 1; save(); render(); window.scrollTo(0, 0); toast(L('นำเข้าแล้ว ' + list.length + ' เกม', list.length + ' game(s) imported'));
    }).catch(function (err) { toast(L('อ่านไฟล์ไม่ได้: ', 'Cannot read the file: ') + (err.message || err)); });
    e.target.value = '';
  };
  $('#bPres').onclick = presenter;
  $('#bLang').onclick = function () { setLang(LANG === 'en' ? 'th' : 'en'); };
  $('#bTheme').onclick = function () {
    var cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(THEME, document.documentElement.dataset.theme); } catch (e) {} render();
  };
  try { var th0 = localStorage.getItem(THEME); if (th0) document.documentElement.dataset.theme = th0; } catch (e) {}

  render();
})(window);

</script>
</body>
</html>
